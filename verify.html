<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Midwife Connect — Verify your email</title>
<link rel="stylesheet" href="css/styles.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@500;600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
</head>
<body>

<div class="login-page">

  <div class="login-brand">
    <img class="hero" src="images/hero-placeholder.svg" alt="">
    <div class="login-brand-content">
      <div class="login-brand-mark">
        <img src="images/logo.svg" alt="" width="34" height="34">
        Midwife Connect
      </div>
    </div>
    <div class="login-brand-quote">
      <h2>Almost there.</h2>
      <p>Confirm your email to finish setting up your account.</p>
    </div>
  </div>

  <div class="login-form-panel">
    <div class="login-form-wrap">
      <h1>Enter your code</h1>
      <p>We've sent a 6-digit code to <strong id="targetEmail">your email</strong>.</p>

      <div class="demo-hint" id="demoCodeBanner" style="margin-top:0; margin-bottom:1.4rem;">
        Demo mode — no real email was sent. Your code is: <strong id="demoCode">------</strong>
      </div>

      <div class="login-error" id="verifyError">That code doesn't match. Try again.</div>

      <form id="verifyForm" novalidate>
        <div class="field">
          <label for="code">Verification code</label>
          <input type="text" id="code" inputmode="numeric" maxlength="6" placeholder="123456" required>
        </div>
        <button type="submit" class="btn btn-primary btn-block">Verify account</button>
      </form>
    </div>
  </div>

</div>

<script src="js/auth.js"></script>
<script src="js/verify.js"></script>
</body>
</html>
